[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corum"
version = "0.1.0"
description = "Configuration and tooling for private Corum academic vaults"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27,<1",
    "markdownify>=0.13",
    "pydantic>=2,<3",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
corum = "corum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    'ignore:Field name "schema".*shadows an attribute in parent "BaseModel":UserWarning',
]
