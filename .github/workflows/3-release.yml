name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to publish
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Correctness Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Verify the exact commit that will be tagged and released: the
          # pushed main commit, or the existing tag on manual dispatch.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  tag:
    name: Cut Release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [verify]
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute Next Tag
        id: bump
        env:
          TITLE: ${{ github.event.head_commit.message }}
          BODY: ${{ github.event.head_commit.message }}
        run: |
          tag="$(.github/scripts/semver-tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push Tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git tag "$NEW_TAG" "$GITHUB_SHA"
          git push origin "$NEW_TAG"

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [tag]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.tag.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag || inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
