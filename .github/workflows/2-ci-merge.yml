name: CI (merge)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static + Unit + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./cmd/corum
